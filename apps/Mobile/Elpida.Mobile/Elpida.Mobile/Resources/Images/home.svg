<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the house body (Plastic/Metal look) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" /> <!-- Highlight -->
      <stop offset="20%" style="stop-color:#d1d9e6;stop-opacity:1" /> <!-- Main Color -->
      <stop offset="100%" style="stop-color:#a0a9b5;stop-opacity:1" /> <!-- Shadow -->
    </linearGradient>
    
    <!-- Gradient for the roof (Terracotta/Wood look) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cc7a5c;stop-opacity:1" /> 
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Main House Body -->
  <path d="M60 180 L60 100 L196 100 L196 180 Z" fill="url(#bodyGrad)" stroke="#707a8a" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Bevel/Highlight Overlay for the Body -->
  <path d="M60 100 L60 110 L196 110 L196 100 Z" fill="white" fill-opacity="0.3" /> <!-- Top Highlight -->
  <path d="M60 100 L70 100 L70 180 L60 180 Z" fill="white" fill-opacity="0.2" /> <!-- Left Highlight -->

  <!-- The Roof -->
  <path d="M30 100 L128 20 L226 100 Z" fill="url(#roofGrad)" stroke="#4d2a1a" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Roof Bevel -->
  <path d="M30 100 L128 35 L226 100 Z" fill="white" fill-opacity="0.2" /> <!-- Roof highlight -->

  <!-- The Door (Classic recessed look) -->
  <rect x="115" y="135" width="46" height="45" rx="3" fill="#5d3a1a" stroke="#3e2a1a" stroke-width="2" />
  <!-- Door Handle -->
  <circle cx="150" cy="157" r="3" fill="#d4af37" />
  
  <!-- Window -->
  <rect x="70" y="115" width="35" height="35" rx="2" fill="#add8e6" stroke="#808080" stroke-width="2" />
  <!-- Window Panes -->
  <line x1="87.5" y1="115" x2="87.5" y2="150" stroke="#808080" stroke-width="2" />
  <line x1="70" y1="132.5" x2="105" y2="132.5" stroke="#808080" stroke-width="2" />
</svg>