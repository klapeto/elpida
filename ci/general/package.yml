.package:linux:
  image: $IMAGE_NAME
  stage: package
  tags:
    - amd64
  script:
    - ./scripts/Linux/createAppImage.sh "$INSTALL_DIR" bin/elpida-qt $ELPIDA_VERSION_STRING $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.AppImage
    - rm "$INSTALL_DIR/bin/elpida-qt"
    - ./scripts/Linux/createAppImage.sh "$INSTALL_DIR" bin/elpida-cli $ELPIDA_VERSION_STRING $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.AppImage
    - sha256sum "$PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.AppImage" > $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.SHA256SUMS
    - sha256sum "$PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.AppImage" > $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.SHA256SUMS
  artifacts:
    expire_in: 2h30min
    paths:
      - $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.AppImage
      - $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.SHA256SUMS
      - $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.AppImage
      - $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.SHA256SUMS

.package:windows:
  image: $IMAGE_NAME
  stage: package
  tags:
    - amd64
  script:
    - |
      currentDir=$(pwd)
      stagingDir=$(mktemp -d -t ci-XXXXXXXXXX)
      if [[ -e "$INSTALL_DIR/bin/elpida-qt.exe" ]]; then
        cp "$INSTALL_DIR/bin/elpida-qt.exe" "$stagingDir"
        cp "$INSTALL_DIR/bin/qt.conf" "$stagingDir"
      fi
      mkdir "$stagingDir/Benchmarks"
      find "$INSTALL_DIR/bin/Benchmarks" -type f -name '*.exe' -exec cp "{}" "$stagingDir/Benchmarks" \;
      cp "$INSTALL_DIR/bin/elpida-cli.exe" "$stagingDir"
      cp "$INSTALL_DIR/bin/elpida-info-dumper.exe" "$stagingDir"
      cp -r "$INSTALL_DIR/bin/assets" "$stagingDir"
      cd "$stagingDir"
      zip z -r .
      cp ./z.zip "$currentDir/$PACKAGE_FILENAME.zip"
      cd "$currentDir"
      sha256sum "$PACKAGE_FILENAME.zip" > SHA256SUMS
      rm -rf "$stagingDir"
  artifacts:
    paths:
      - $PACKAGE_FILENAME.zip
      - SHA256SUMS

package:windows:amd64:
  variables:
    TARGET_ARCH: amd64
    MINGW_ARCH: x86_64
    TARGET_OS: windows
  dependencies:
    - build:windows:amd64
  extends: .package:windows

package:windows:i686:
  variables:
    TARGET_ARCH: i686
    MINGW_ARCH: i686
    TARGET_OS: windows
  dependencies:
    - build:windows:i686
  extends: .package:windows

package:windows:aarch64:
  variables:
    TARGET_ARCH: aarch64
    MINGW_ARCH: aarch64
    TARGET_OS: windows
  dependencies:
    - build:windows:aarch64
  extends: .package:windows

package:linux:amd64:
  variables:
    TARGET_ARCH: amd64
    TARGET_OS: linux
    TARGET_ARCH_APPIMAGE_RUNTIME: x86_64
    TARGET_ARCH_APPIMAGE_APT: amd64
  dependencies:
    - build:linux:amd64
  extends: .package:linux

package:linux:aarch64:
  variables:
    TARGET_ARCH: aarch64
    TARGET_OS: linux
    TARGET_ARCH_APPIMAGE_RUNTIME: aarch64
    TARGET_ARCH_APPIMAGE_APT: arm64
  dependencies:
    - build:linux:aarch64
  extends: .package:linux