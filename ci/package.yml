.package:linux:
  image: $IMAGE_NAME
  stage: package
  tags:
    - amd64
  script:
    - ./scripts/Linux/setupDependencies.sh "$INSTALL_DIR/bin/elpida-qt" "$INSTALL_DIR" "/opt/sysroots/$TARGET_TRIPLE" "\$this_dir"
    - ./scripts/Linux/createAppImage.sh "$INSTALL_DIR" bin/elpida-qt $ELPIDA_VERSION_STRING $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.AppImage
    - rm "$INSTALL_DIR/bin/elpida-qt" #reduce the size of AppImage
    - ./scripts/Linux/createAppImage.sh "$INSTALL_DIR" bin/elpida-cli $ELPIDA_VERSION_STRING $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.AppImage
    - sha256sum "$PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.AppImage" > $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.SHA256SUMS
    - sha256sum "$PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.AppImage" > $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.SHA256SUMS
  artifacts:
    expire_in: 2h30min
    paths:
      - $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.AppImage
      - $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.SHA256SUMS
      - $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.AppImage
      - $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.SHA256SUMS

.package:windows:
  image: $IMAGE_NAME
  stage: package
  tags:
    - amd64
  script:
    - |
      currentDir=$(pwd)
      cd "$INSTALL_DIR/bin"
      zip z -r .
      cp ./z.zip "$currentDir/$PACKAGE_FILENAME.zip"
      cd "$currentDir"
      sha256sum "$PACKAGE_FILENAME.zip" > SHA256SUMS
  artifacts:
    paths:
      - $PACKAGE_FILENAME.zip
      - SHA256SUMS

package:linux:x86_64:
  variables:
    TARGET_ARCH: x86_64
    TARGET_TRIPLE: x86_64-linux-gnu
  dependencies:
    - build:linux:x86_64
  extends: .package:linux

