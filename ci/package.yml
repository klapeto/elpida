.Package Linux:
  image: $IMAGE_NAME
  stage: package
  tags:
    - amd64
  script:
    - rm "$INSTALL_DIR/bin/$BINARY_TO_REMOVE"
    - rm -rf "$INSTALL_DIR/include" "$INSTALL_DIR/share" "$INSTALL_DIR/lib" "$INSTALL_DIR/bin/libpng*"
    - ./scripts/Linux/setupDependencies.sh "$INSTALL_DIR/bin/$BINARY" "$INSTALL_DIR" "/opt/sysroots/$TARGET_TRIPLE" "\$this_dir" "$TARGET_TRIPLE"
    - ./scripts/Linux/finalizeAppDir.sh "$INSTALL_DIR" "bin/$BINARY" "$PACKAGE_FILENAME.tar.xz"
    - sha256sum "$PACKAGE_FILENAME.tar.xz" > ""$PACKAGE_FILENAME.SHA256SUMS""
  artifacts:
    expire_in: 2h30min
    paths:
      - $PACKAGE_FILENAME.tar.xz
      - $PACKAGE_FILENAME.SHA256SUMS

.Package Windows:
  image: $IMAGE_NAME
  stage: package
  tags:
    - amd64
  script:
    - |
      currentDir=$(pwd)
      rm -rf "$INSTALL_DIR/include" "$INSTALL_DIR/share" "$INSTALL_DIR/lib" "$INSTALL_DIR/bin/libpng*" "$INSTALL_DIR/bin/*.dll"
      rm "$INSTALL_DIR/bin/$BINARY_TO_REMOVE"
      cd "$INSTALL_DIR/bin"
      zip z -r .
      cp ./z.zip "$currentDir/$PACKAGE_FILENAME.zip"
      cd "$currentDir"
      sha256sum "$PACKAGE_FILENAME.zip" > SHA256SUMS
  artifacts:
    paths:
      - $PACKAGE_FILENAME.zip
      - SHA256SUMS

.Package Qt:
  variables:
    PACKAGE_SUFFIX: Qt
    BINARY: elpida-qt
    BINARY_TO_REMOVE: elpida-cli

.Package Cli:
  variables:
    PACKAGE_SUFFIX: Cli
    BINARY: elpida-cli
    BINARY_TO_REMOVE: elpida-qt

Package Qt (x86_64-linux-gnu):
  variables:
    TARGET_TRIPLE: x86_64-linux-gnu
  dependencies:
    - Build (x86_64-linux-gnu)
  extends:
    - .Package Qt
    - .Package Linux

