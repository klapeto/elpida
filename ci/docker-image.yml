.Build Docker Image:
  image: docker:latest
  stage: build-docker-images
  tags:
    - amd64
  timeout: 5h 30m
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker pull $IMAGE_NAME || true
    - docker build --build-arg IMAGE="$IMAGE_BASE_NAME" --build-arg TARGET_TRIPLE="$TARGET_TRIPLE" --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from $IMAGE_NAME -t $IMAGE_NAME -f docker/build-environment/Dockerfile .
    - docker push $IMAGE_NAME
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - docker/build-environment/Dockerfile
          - ci/general/docker-image.yml
          - scripts/docker/build-base.sh
          - scripts/docker/build-hwloc.sh
          - scripts/docker/build-autotools-based.sh
          - scripts/docker/build-linux-specific.sh
          - scripts/docker/build-llvm.sh
          - scripts/docker/build-qt.sh
          - scripts/docker/generate-sysroot.sh
          - scripts/docker/packages

Build Docker Image (x86_64-linux-gnu):
  tags:
    - amd64
  timeout: 5h 30m
  variables:
    TARGET_TRIPLE: x86_64-linux-gnu
  dependencies:
    - Build Docker Image (Base)
  extends: .Build Docker Image

