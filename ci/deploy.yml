.Deploy Linux:
  stage: deploy
  tags:
    - amd64
  only:
    - master
    - staging
  environment:
    name: $DEPLOY_ENVIRONMENT
  script:
    - cp "$PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.tar.xz" "$PACKAGE_FILENAME_DEPLOY.$PACKAGE_QT_SUFFIX.tar.xz"
    - cp "$PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.tar.xz" "$PACKAGE_FILENAME_DEPLOY.$PACKAGE_CLI_SUFFIX.tar.xz"
    - sha256sum "$PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.tar.xz" > $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.tar.xz.SHA256SUMS
    - sha256sum "$PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.tar.xz" > $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.tar.xz.SHA256SUMS
    - sha256sum "$PACKAGE_FILENAME_DEPLOY.$PACKAGE_QT_SUFFIX.tar.xz" > $PACKAGE_FILENAME_DEPLOY.$PACKAGE_QT_SUFFIX.tar.xz.SHA256SUMS
    - sha256sum "$PACKAGE_FILENAME_DEPLOY.$PACKAGE_CLI_SUFFIX.tar.xz" > $PACKAGE_FILENAME_DEPLOY.$PACKAGE_CLI_SUFFIX.tar.xz.SHA256SUMS
  artifacts:
    paths:
      - $PACKAGE_FILENAME_DEPLOY.$PACKAGE_QT_SUFFIX.tar.xz
      - $PACKAGE_FILENAME_DEPLOY.$PACKAGE_CLI_SUFFIX.tar.xz
      - $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.tar.xz
      - $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.tar.xz
      - $PACKAGE_FILENAME_DEPLOY.$PACKAGE_QT_SUFFIX.tar.xz.SHA256SUMS
      - $PACKAGE_FILENAME_DEPLOY.$PACKAGE_CLI_SUFFIX.tar.xz.SHA256SUMS
      - $PACKAGE_FILENAME.$PACKAGE_QT_SUFFIX.tar.xz.SHA256SUMS
      - $PACKAGE_FILENAME.$PACKAGE_CLI_SUFFIX.tar.xz.SHA256SUMS

.Deploy Windows:
  stage: deploy
  tags:
    - amd64
  environment:
    name: $DEPLOY_ENVIRONMENT
  only:
    - master
    - staging
  script:
    - cp "$PACKAGE_FILENAME.zip" "$PACKAGE_FILENAME_DEPLOY.zip"
    - sha256sum "$PACKAGE_FILENAME.zip" > $PACKAGE_FILENAME.zip.SHA256SUMS
    - sha256sum "$PACKAGE_FILENAME_DEPLOY.zip" > $PACKAGE_FILENAME_DEPLOY.zip.SHA256SUMS
  dependencies:
    - package:$TARGET_TRIPLE
  artifacts:
    paths:
      - $PACKAGE_FILENAME_DEPLOY.zip
      - $PACKAGE_FILENAME.zip
      - $PACKAGE_FILENAME_DEPLOY.zip.SHA256SUMS
      - $PACKAGE_FILENAME.zip.SHA256SUMS

Deploy (x86_64-linux-gnu):
  variables:
    TARGET_TRIPLE: x86_64-linux-gnu
  dependencies:
    - Package (x86_64-linux-gnu)
  extends: .Deploy Linux

Deploy (i386-linux-gnu):
  variables:
    TARGET_TRIPLE: i386-linux-gnu
  dependencies:
    - Package (i386-linux-gnu)
  extends: .Deploy Linux

