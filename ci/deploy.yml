.Deploy Linux:
  stage: deploy
  tags:
    - amd64
  only:
    - master
    - staging
  environment:
    name: $DEPLOY_ENVIRONMENT
  script:
    - cp "$PACKAGE_FILENAME.tar.xz" "$PACKAGE_FILENAME_DEPLOY.tar.xz"
    - sha256sum "$PACKAGE_FILENAME.tar.xz" > $PACKAGE_FILENAME.tar.xz.SHA256SUMS
    - sha256sum "$PACKAGE_FILENAME_DEPLOY.tar.xz" > $PACKAGE_FILENAME_DEPLOY.tar.xz.SHA256SUMS
  artifacts:
    paths:
      - $PACKAGE_FILENAME_DEPLOY.tar.xz
      - $PACKAGE_FILENAME.tar.xz
      - $PACKAGE_FILENAME_DEPLOY.tar.xz.SHA256SUMS
      - $PACKAGE_FILENAME.tar.xz.SHA256SUMS

.Deploy Windows:
  stage: deploy
  tags:
    - amd64
  environment:
    name: $DEPLOY_ENVIRONMENT
  only:
    - master
    - staging
  script:
    - cp "$PACKAGE_FILENAME.zip" "$PACKAGE_FILENAME_DEPLOY.zip"
    - sha256sum "$PACKAGE_FILENAME.zip" > $PACKAGE_FILENAME.zip.SHA256SUMS
    - sha256sum "$PACKAGE_FILENAME_DEPLOY.zip" > $PACKAGE_FILENAME_DEPLOY.zip.SHA256SUMS
  dependencies:
    - package:$TARGET_TRIPLE
  artifacts:
    paths:
      - $PACKAGE_FILENAME_DEPLOY.zip
      - $PACKAGE_FILENAME.zip
      - $PACKAGE_FILENAME_DEPLOY.zip.SHA256SUMS
      - $PACKAGE_FILENAME.zip.SHA256SUMS

.Deploy Qt:
  variables:
    PACKAGE_SUFFIX: Qt

.Deploy Cli:
  variables:
    PACKAGE_SUFFIX: Cli

Deploy Qt (x86_64-linux-gnu):
  variables:
    TARGET_TRIPLE: x86_64-linux-gnu
  dependencies:
    - Package Qt (x86_64-linux-gnu)
  extends:
    - .Deploy Qt
    - .Deploy Linux

Deploy Cli (x86_64-linux-gnu):
  variables:
    TARGET_TRIPLE: x86_64-linux-gnu
  dependencies:
